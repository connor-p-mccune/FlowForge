name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowforge/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flowforge/server/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  client:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowforge/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: flowforge/client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowforge/cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Zero runtime dependencies — no install step, just the node:test suite.
      - run: npm test

  ai-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowforge/ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      # Pinned deliberately. An unpinned linter is a build that can go red with
      # no commit behind it: ruff's *default* rule set grows between releases,
      # so `pip install ruff` silently changed what this job enforced. The rules
      # themselves are selected in ai-service/ruff.toml; this pins the tool that
      # reads them. Bump both together.
      - run: pip install ruff==0.16.2
      - run: ruff check .
      # Coverage flags come from pytest.ini (addopts)
      - run: python -m pytest -v
